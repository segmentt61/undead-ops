# Render blueprint: one free web service in Frankfurt running the game server (HTTP + WebSocket on one port).
services:
  - type: web
    name: undead-ops-eu
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
